name: Deploy Workflow
on:
  push:
    branches:
      - main
      - dev
      - test
  pull_request:
    branches:
      - main
      - dev
      - test
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Perform linting with pylint
        run: |
          pylint project/**/*.py --disable=R0903
          pylint main.py --disable=R0903
      - name: Perform linting with flake8
        run: | 
          flake8 src/
          flake8 main.py
